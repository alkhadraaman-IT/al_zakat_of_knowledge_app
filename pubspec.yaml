name: al_zakat_of_knowledge_app
description: "زكاة العلم - Zakat Al-Ilm: A community-driven academic platform for university students."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Backend & Auth
  supabase_flutter: ^2.18.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^17.0.1

  # Localization & RTL
  easy_localization: ^3.0.7

  # Responsive Layout
  flutter_screenutil: ^5.9.3

  # Offline Storage & Cache
  shared_preferences: ^2.3.4
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

  # Network Status
  internet_connection_checker: ^3.0.1

  # Routing
  go_router: ^14.8.1

  # UI & Media
  smooth_page_indicator: ^1.2.0+3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  cupertino_icons: ^1.0.8
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  syncfusion_flutter_pdfviewer: ^35.1.40+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Notifications
  timezone: ^0.11.2
  flutter_local_notifications: ^22.3.3

  # Splash & Icons
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  mocktail: ^1.0.5
  hive_ce_generator: ^1.11.1
  bloc_test: ^10.0.0
  rename: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app.png"
  image_path_ios: "assets/images/logo_app.png"
  adaptive_icon_background: "#102c3a"
  adaptive_icon_foreground: "assets/images/logo_app.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/

  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Italic.ttf
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-ThinItalic.ttf
          weight: 100
          style: italic

    - family: Thmanyah
      fonts:
        - asset: assets/fonts/Thmanyah/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/Thmanyah/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/Thmanyah/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/Thmanyah/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/Thmanyah/thmanyahsans-Black.otf
          weight: 900

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
