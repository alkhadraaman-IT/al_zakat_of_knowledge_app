<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>المفضلة - زكاة العلم</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Arabic Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Custom configuration for Tailwind -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#090f1d',
              card: '#101b2f',
              cardBorder: '#00d68f',
              accent: '#00e599',
              accentDark: '#00b075',
              surface: '#152238',
              muted: '#7a8c9e'
            }
          },
          fontFamily: {
            arabic: ['Cairo', 'sans-serif']
          },
          boxShadow: {
            'glow-emerald': '0 0 25px rgba(0, 229, 153, 0.35)',
            'glow-button': '0 0 20px rgba(0, 229, 153, 0.45)',
            'glow-pin': '0 0 22px rgba(0, 229, 153, 0.7)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #070c18;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }
    
    /* Map radar grid background pattern */
    .radar-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 229, 153, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 229, 153, 0.12) 1px, transparent 1px);
      background-size: 55px 55px;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container strictly tailored for mobile viewport (~400px width) matching screenshot -->
<main class="w-full max-w-[420px] min-h-screen bg-[#08101e] relative overflow-hidden flex flex-col justify-between border border-slate-800/60 shadow-2xl sm:rounded-[36px]" data-purpose="mobile-screen">
<!-- Scrollable Content Layer -->
<div class="flex-1 overflow-y-auto px-5 pt-8 pb-32">
<!-- BEGIN: TopBar -->
<header class="flex items-center justify-between mb-8" data-purpose="app-header">
<!-- Right side: App Branding & Graduation Cap Logo -->
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-2xl bg-emerald-400 flex items-center justify-center text-brand-bg shadow-[0_0_15px_rgba(0,229,153,0.3)]">
<!-- Graduation Cap Icon -->
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 14l9-5-9-5-9 5 9 5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="text-right">
<h1 class="text-xl font-bold tracking-tight text-white leading-none">زكاة العلم</h1>
<span class="text-xs text-slate-400 mt-1 block">صدقة جارية بعلمك</span>
</div>
</div>
<!-- Left side: Notification bell & User avatar badge -->
<div class="flex items-center gap-2.5">
<!-- Notification Bell with Active Dot -->
<div class="relative">
<button class="w-11 h-11 rounded-2xl bg-[#142033] border border-slate-700/40 flex items-center justify-center text-slate-300 hover:text-white transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="absolute -top-1 right-0 w-3 h-3 bg-emerald-400 rounded-full border-2 border-[#08101e]"></span>
</div>
<!-- User Avatar Badge with Arabic Letter "ع" -->
<button class="w-11 h-11 rounded-2xl bg-[#00d68f] text-[#08101e] font-extrabold text-lg flex items-center justify-center shadow-[0_0_12px_rgba(0,214,143,0.3)]">
            ع
          </button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: FavoritesScreenHeader -->
<section class="flex items-center justify-between mb-6" data-purpose="screen-title-banner">
<div class="flex items-center gap-3">
<!-- Bookmark Ribbon Box Badge -->
<div class="w-10 h-10 rounded-xl bg-[#132238] border border-emerald-500/30 flex items-center justify-center text-emerald-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h2 class="text-2xl font-black text-white leading-tight">المفضلة</h2>
<p class="text-xs text-slate-400 font-medium">صدقة جارية بعلمك</p>
</div>
</div>
</section>
<!-- END: FavoritesScreenHeader -->
<!-- BEGIN: CategoryTabsPillBar -->
<nav class="flex items-center gap-2 p-1.5 bg-[#121c2e] rounded-full border border-slate-700/50 mb-7 overflow-x-auto" data-purpose="category-pills">
<!-- Tab 1: Active "محاضرات محفوظة" -->
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-[#00e599] text-[#08101e] font-bold text-sm shadow-sm whitespace-nowrap">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewbox="0 0 24 24">
<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>محاضرات محفوظة</span>
</button>
<!-- Tab 2: "مقالات محفوظة" -->
<button class="flex items-center gap-1.5 px-3 py-2 text-slate-300 font-semibold text-xs whitespace-nowrap hover:text-white transition">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>مقالات محفوظة</span>
</button>
<!-- Tab 3: "أدوات محفوظة" -->
<button class="flex items-center gap-1.5 px-3 py-2 text-slate-300 font-semibold text-xs whitespace-nowrap hover:text-white transition">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>أدوات محفوظة</span>
</button>
</nav>
<!-- END: CategoryTabsPillBar -->
<!-- BEGIN: FeaturedSavedLectureCard -->
<!-- Main glowing emerald featured card -->
<article class="bg-[#101b2f] rounded-[26px] border border-emerald-500/50 shadow-glow-emerald overflow-hidden mb-6 transition" data-purpose="lecture-card">
<!-- Radar & Map Banner View with center glowing location pin -->
<div class="relative h-44 w-full bg-[#132238] radar-grid flex items-center justify-center overflow-hidden border-b border-slate-700/40">
<!-- Subtle radar vignette gradient -->
<div class="absolute inset-0 bg-radial from-transparent via-[#101b2f]/40 to-[#101b2f]"></div>
<!-- Pulsing Map Pin -->
<div class="relative z-10 flex items-center justify-center">
<div class="w-12 h-12 rounded-full bg-emerald-400 text-brand-bg flex items-center justify-center shadow-glow-pin">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
<!-- Location Pill Badge at bottom right of radar banner -->
<div class="absolute bottom-3 left-4 bg-[#0a1220]/80 backdrop-blur-md px-3.5 py-1 rounded-full border border-slate-700/50 text-[11px] font-semibold text-slate-200">
            مسجد الراجحي — الرياض
          </div>
</div>
<!-- Lecture Details Body -->
<div class="p-5">
<!-- Title with Bookmark Status Indicator -->
<div class="flex items-start justify-between gap-3 mb-4">
<div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 flex-shrink-0">
<svg class="w-5 h-5 fill-current" viewbox="0 0 20 20">
<path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path>
</svg>
</div>
<h3 class="text-lg font-bold text-white leading-snug flex-1 text-right">
              أصول الفقه العظيم — المجلس الثالث
            </h3>
</div>
<!-- Lecturer Profile & Name -->
<div class="flex items-center justify-start gap-2.5 mb-4">
<div class="w-7 h-7 rounded-full bg-emerald-400 text-brand-bg font-extrabold text-xs flex items-center justify-center">
              د
            </div>
<span class="text-sm font-semibold text-slate-200">د. سعد العتيبي</span>
</div>
<!-- Date and Location Metas -->
<div class="space-y-1.5 mb-5 text-xs text-slate-400 font-medium">
<div class="flex items-center justify-start gap-2">
<!-- Calendar Icon -->
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>السبت ١٠ أكتوبر</span>
<span class="mx-1">•</span>
<!-- Clock Icon -->
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>بعد المغرب</span>
</div>
<div class="flex items-center justify-start gap-2">
<!-- Map Pin Icon -->
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>مسجد الراجحي — الرياض</span>
</div>
</div>
<!-- Seats & Attendance Progress Metric -->
<div class="mb-5" data-purpose="progress-metric">
<div class="flex items-center justify-between text-xs font-bold mb-1.5">
<span class="text-emerald-400 font-extrabold text-sm">60%</span>
<span class="text-slate-300">18/30</span>
</div>
<!-- Progress Track -->
<div class="w-full h-2 rounded-full bg-[#1b2a44] overflow-hidden flex">
<div class="h-full bg-emerald-400 rounded-full" style="width: 60%;"></div>
</div>
</div>
<!-- Action CTA Button -->
<button class="w-full py-3.5 px-4 rounded-2xl bg-emerald-400 text-brand-bg font-bold text-base hover:bg-emerald-300 active:scale-[0.98] transition shadow-glow-button flex items-center justify-center">
            احجز مقعدك
          </button>
</div>
</article>
<!-- END: FeaturedSavedLectureCard -->
<!-- Secondary Ghost Card Peeking from Bottom (Matches Screenshot Layout) -->
<div class="h-24 w-full bg-[#101b2f] rounded-[26px] border border-slate-700/40 opacity-50 relative overflow-hidden radar-grid flex items-center justify-center">
<div class="w-8 h-8 rounded-full bg-emerald-400/40 flex items-center justify-center">
<svg class="w-4 h-4 text-emerald-300" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</div>
<!-- BEGIN: FloatingGlowingBottomNavigationDock -->
<nav class="absolute bottom-5 inset-x-5 h-20 bg-[#121c2e]/90 backdrop-blur-xl border border-slate-700/50 rounded-full px-6 flex items-center justify-between shadow-2xl z-40" data-purpose="bottom-navigation-dock">
<!-- Left Tab: المفضلة (Active) -->
<button class="flex flex-col items-center justify-center gap-1 text-emerald-400">
<div class="w-10 h-10 rounded-2xl border border-emerald-400/30 flex items-center justify-center bg-emerald-500/10">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
</svg>
</div>
<span class="text-[11px] font-bold">المفضلة</span>
</button>
<!-- Center Raised Glowing Add Button -->
<div class="relative -top-5">
<button aria-label="إضافة" class="w-16 h-16 rounded-full bg-emerald-400 text-brand-bg flex items-center justify-center shadow-glow-button border-4 border-[#08101e] hover:scale-105 active:scale-95 transition">
<svg class="w-8 h-8 stroke-[2.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Right Tab: الرئيسية -->
<button class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition">
<div class="w-10 h-10 rounded-2xl flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-semibold text-slate-300">الرئيسية</span>
</button>
</nav>
<!-- END: FloatingGlowingBottomNavigationDock -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
