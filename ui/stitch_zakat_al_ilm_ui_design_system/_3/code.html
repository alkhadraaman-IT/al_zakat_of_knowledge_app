<script>
  (function initSplashMicroInteractions() {
    const progressEl = document.getElementById('splash-progress');
    const pctEl = document.getElementById('splash-pct');
    let current = 78;

    const interval = setInterval(() => {
      if (current < 100) {
        current += Math.floor(Math.random() * 6) + 3;
        if (current > 100) current = 100;
        if (progressEl) progressEl.style.width = current + '%';
        if (pctEl) pctEl.textContent = current + '%';
      } else {
        clearInterval(interval);
      }
    }, 450);

    window.launchAppDirectly = function() {
      if (progressEl) progressEl.style.width = '100%';
      if (pctEl) pctEl.textContent = '100%';
    };
  })();
