<!-- BEGIN: Interactive Switching Script -->
<script data-purpose="view-state-controller">
    function switchView(viewId) {
      // Hide all steps
      const steps = ['step-categories', 'step-form', 'step-success'];
      steps.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
        
        // Reset tab styling
        const tab = document.getElementById('tab-' + id);
        if (tab) {
          tab.classList.remove('text-emerald-400', 'font-bold', 'bg-[#1b2840]');
          tab.classList.add('text-slate-400');
        }
      });

      // Activate selected step
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
      }

      // Highlight active tab
      const activeTab = document.getElementById('tab-' + viewId);
      if (activeTab) {
        activeTab.classList.remove('text-slate-400');
        activeTab.classList.add('text-emerald-400', 'font-bold', 'bg-[#1b2840]');
      }
    }
  </script>
<!-- END: Interactive Switching Script -->
